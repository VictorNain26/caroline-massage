name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      # `install chromium` pose aussi le « chromium headless shell », build
      # distinct que Playwright utilise en mode headless sans `channel`.
      # https://playwright.dev/docs/browsers#install-browsers
      - run: pnpm exec playwright install --with-deps chromium
      # La suite rebâtit `dist/` elle-même (playwright.config.ts, webServer) et
      # le sert par `wrangler dev`, donc via le routage d'assets de production.
      - run: pnpm test:a11y
