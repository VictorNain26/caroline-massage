question: "Y a-t-il des contre-indications ?"
reponse: >-
  Oui, certaines existent : état fiévreux, phlébite, hypertension sévère non
  stabilisée, grossesse de moins de trois mois, intervention chirurgicale
  récente, cancer en cours de traitement (sauf accord médical). En cas de
  doute, consultez votre médecin avant la séance.
ordre: 3
