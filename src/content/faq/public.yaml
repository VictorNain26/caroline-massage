question: "Les soins sont-ils ouverts à tout le monde ?"
reponse: >-
  Oui, j’accueille une clientèle mixte, femmes et hommes, dans un cadre
  professionnel et respectueux, exclusivement dédié au bien-être et à la
  détente. Le respect de la personne et du corps est une priorité absolue :
  aucune demande ou attitude inappropriée ne sera tolérée et entraînera
  l’arrêt immédiat de la séance.
ordre: 4
