titre: "Un cadre pensé pour souffler."
paragraphes:
  - >-
    Mon cabinet est ouvert à une clientèle mixte, femmes et hommes. Mes soins
    sont strictement dédiés au bien-être et à la détente.
  - >-
    Le respect de la personne et du corps est une priorité absolue : aucune
    demande ou attitude inappropriée ne sera tolérée et entraînera l’arrêt
    immédiat de la séance.
  - >-
    Prévoyez 15 minutes de plus, le temps d’arriver tranquillement et de
    repartir sans précipitation. Paiement sur place : espèces ou carte
    bancaire. En cas d’annulation ou de report, merci de me prévenir à
    l’avance.
